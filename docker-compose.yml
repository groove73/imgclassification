version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 256M
    restart: always

# Optional: Add Redis or DB if needed in the future
